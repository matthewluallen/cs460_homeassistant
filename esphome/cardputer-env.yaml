# DEVICE: Cardputer + ENV Pro (BME688).  Composition only — see common/, hosts/, sensors/.
# Flash from the ESPHome dashboard (port 6052) -> Install -> "Plug into this computer"
# (Chrome WebSerial). The screen shows the IP; add it in HA by that IP:6053, key blank.
substitutions:
  name: cardputer-env
  friendly_name: "Cardputer ENV"
esphome:
  name: ${name}
  friendly_name: ${friendly_name}
packages:
  base:   !include common/base.yaml
  host:   !include hosts/cardputer.yaml
  sensor: !include sensors/env-bme688.yaml
