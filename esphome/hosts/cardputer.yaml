# HOST package: M5Stack Cardputer (StampS3 / ESP32-S3).
#
# Grove / HY2.0 "PORT.CUSTOM":  white = G1 = GPIO1,  yellow = G2 = GPIO2
#   (red = 5V, black = GND). These are plain GPIO, usable as I2C / UART / digital.
# PORT.A I2C convention (M5):  SDA = yellow (GPIO2),  SCL = white (GPIO1).
# Display: ST7789V2, 240x135, pins confirmed on hardware (Module 5 dry-run).
#
# This package sets the per-host pin substitutions that the SENSOR packages
# consume (${sda_pin} ${scl_pin} ${white_pin} ${yellow_pin}) and drives the
# on-screen status (title + IP + the generic disp_line + the HA add-by-IP hint).

substitutions:
  board_id: esp32-s3-devkitc-1   # generic ESP32-S3 board; proven on this unit
  sda_pin: GPIO2                 # Grove yellow / G2
  scl_pin: GPIO1                 # Grove white  / G1
  white_pin: GPIO1               # Grove white  / G1 (digital-in / UART->host RX / ADC1_CH0)
  yellow_pin: GPIO2              # Grove yellow / G2 (digital-in / ADC1_CH1)

esp32:
  board: ${board_id}
  framework:
    type: esp-idf

font:
  - file: "gfonts://Roboto"      # downloaded at build time; no font file to ship
    id: read                     # the BIG centered sensor reading
    size: 34
  - file: "gfonts://Roboto"
    id: big
    size: 22
  - file: "gfonts://Roboto"
    id: small
    size: 14

spi:
  clk_pin: GPIO36
  mosi_pin: GPIO35

output:
  - platform: ledc
    pin: GPIO38
    id: backlight_out
light:
  - platform: monochromatic
    output: backlight_out
    name: "Backlight"
    restore_mode: ALWAYS_ON

display:
  - platform: st7789v
    model: TTGO TDisplay 135x240
    rotation: 90
    cs_pin: GPIO37
    dc_pin: GPIO34
    reset_pin: GPIO33
    update_interval: 1s
    lambda: |-
      // Red full-screen flash when a sensor package raises disp_alert (motion,
      // magnet, reflection...). Otherwise black. This is the "visual feedback".
      it.fill(id(disp_alert) ? Color(0xD0, 0x10, 0x10) : Color::BLACK);
      // device name (top-left) + IP (top-right), both small
      it.printf(2, 2, id(small), "${friendly_name}");
      if (id(wifi_ip).has_state() && id(wifi_ip).state.length() > 0)
        it.printf(238, 2, TextAlign::TOP_RIGHT, id(small), "%s", id(wifi_ip).state.c_str());
      else
        it.printf(238, 2, TextAlign::TOP_RIGHT, id(small), "setup AP");
      // BIG live reading, centered — the headline each sensor package fills in
      if (!id(disp_line).empty())
        it.printf(120, 62, id(read), TextAlign::CENTER, "%s", id(disp_line).c_str());
      else
        it.printf(120, 62, id(read), TextAlign::CENTER, "starting...");
      it.printf(2, 120, id(small), "HA: ESPHome -> IP:6053");
