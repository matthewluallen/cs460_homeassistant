# SENSOR package: M5 TMOS PIR -> ST STHS34PF80 IR presence/motion. PORT.A I2C @ 0x5A.
#
# This is an I2C THERMAL-presence sensor (not a classic digital PIR): it reports
# a presence value, a motion value, a temperature, plus two "detected" flags.
# Uses M5Stack's own ESPHome external component. REQUIRES ESPHome >= 2026.2.2.
#
# On-screen feedback: the Cardputer shows a big "MOTION!" / "presence" / "clear"
# headline and flashes the screen RED when motion or presence is detected.

external_components:
  - source: github://m5stack/esphome-yaml/components
    components: [sths34pf80]
    refresh: 0s

i2c:
  sda: ${sda_pin}
  scl: ${scl_pin}
  scan: true

sensor:
  - platform: sths34pf80
    id: tmos_pir
    presence:
      name: "TMOS Presence"
      id: tmos_presence
    motion:
      name: "TMOS Motion"
      id: tmos_motion
    temperature:
      name: "TMOS Temperature"
    pres_flag:
      name: "TMOS Presence Detected"
      id: tmos_pres
    mot_flag:
      name: "TMOS Motion Detected"
      id: tmos_mot
    presence_threshold: 200
    motion_threshold: 200
    presence_hysteresis: 50
    motion_hysteresis: 50
    odr: 8
    update_interval: 1s

# Drive the Cardputer screen every second from the detection flags.
interval:
  - interval: 1s
    then:
      - lambda: |-
          bool m = id(tmos_mot).has_state() && id(tmos_mot).state;
          bool p = id(tmos_pres).has_state() && id(tmos_pres).state;
          if (m)      { id(disp_line) = "MOTION!";  id(disp_alert) = true; }
          else if (p) { id(disp_line) = "presence"; id(disp_alert) = true; }
          else        { id(disp_line) = "clear";    id(disp_alert) = false; }
